{% extends "welcome.html" %}
{% block content %}
<p class="eyebrow">Welcome back</p>
<h1>Sign in</h1>
{% if error %}<p class="notice err">{{ error }}</p>{% endif %}
{% include "_google.html" %}
<form class="auth-form" method="post" action="/login">
  <input type="hidden" name="next" value="{{ next }}">
  <label class="fld" for="email">Email</label>
  <input id="email" name="email" type="email" required autocomplete="email" value="{{ email or '' }}">
  <label class="fld" for="password">Password</label>
  <input id="password" name="password" type="password" required autocomplete="current-password">
  {% if form_error %}<p class="field-error" role="alert">{{ form_error }}</p>{% endif %}
  <div class="welcome-actions"><button class="btn primary" type="submit">Sign in</button></div>
</form>
<p class="auth-foot">
  <a href="/forgot-password">Forgot your password?</a><br>
  No account yet? <a href="/signup{% if next != '/dashboard' %}?next={{ next | urlencode }}{% endif %}">Create one</a><br>
  <a href="/guest">Continue as guest</a>
</p>
{% endblock %}
