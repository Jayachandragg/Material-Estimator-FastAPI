{% extends "welcome.html" %}
{% block content %}
<p class="eyebrow">Account</p>
<h1>Choose a new password</h1>
<form class="auth-form" method="post" action="/reset-password">
  <label class="fld" for="password">New password</label>
  <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
  <label class="fld" for="confirm">Confirm new password</label>
  <input id="confirm" name="confirm" type="password" required minlength="8" autocomplete="new-password">
  {% if form_error %}<p class="field-error" role="alert">{{ form_error }}</p>{% endif %}
  <div class="welcome-actions"><button class="btn primary" type="submit">Save password</button></div>
</form>
<p class="auth-foot"><a href="/forgot-password">Request a new link</a></p>
{% endblock %}
